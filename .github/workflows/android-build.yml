name: Android build

on:
  push:
    branches: [milestone-1, milestone-3, main, release-step]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Class list is in sync with training
        run: npm run check:classes

      - name: Unit tests
        run: npx jest

  debug:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: bd-plate-reader-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Standalone APK with the JavaScript bundled inside, so it runs without Metro
  # or a USB cable. It is signed with the debug keystore that is committed in
  # app/android/app/debug.keystore. That key is public, so this APK is only for
  # testing on your own phone. It must not be published to the Play Store.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: bd-plate-reader-release
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Publish the APK as a GitHub Release so it can be downloaded with one tap
      # on a phone, without a GitHub login. The repository is public, so the
      # release is public too. Runs on pushes to main and release-step only.
      - name: Publish APK as a GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-step')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="build-${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "bd-plate-reader-${SHORT}.apk"
          gh release create "$TAG" "bd-plate-reader-${SHORT}.apk"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --prerelease             --title "BD Plate Reader build ${{ github.run_number }} (${SHORT})"             --notes "Standalone arm64 release APK, signed with the public debug key. For testing on your own phone only."
