name: Android build

on:
  push:
    branches: [milestone-1, milestone-3, integrate-models, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Class list is in sync with training
        run: npm run check:classes

      - name: Unit tests
        run: npx jest

  debug:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: bd-plate-reader-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Standalone APK with the JavaScript bundled inside, so it runs without Metro
  # or a USB cable. It is signed with the debug keystore that is committed in
  # app/android/app/debug.keystore. That key is public, so this APK is only for
  # testing on your own phone. It must not be published to the Play Store.
  release:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: bd-plate-reader-release
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
